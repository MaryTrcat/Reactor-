syntax = "proto3";

package user;

enum MessageType {
  UNKNOWN = 0;
  REGISTER_REQUEST = 1;
  REGISTER_RESPONSE = 2;
  LOGIN_REQUEST = 3;
  LOGIN_RESPONSE = 4;
  QUERY_USER_REQUEST = 5;
  QUERY_USER_RESPONSE = 6;
  CHECK_PERMISSION_REQUEST = 7;
  CHECK_PERMISSION_RESPONSE = 8;
  CHANGE_PASSWORD_REQUEST = 9;
  CHANGE_PASSWORD_RESPONSE = 10;
  DELETE_USER_REQUEST = 11;
  DELETE_USER_RESPONSE = 12;
  LIST_USERS_REQUEST = 13;
  LIST_USERS_RESPONSE = 14;
  RESET_PASSWORD_REQUEST = 15;
  RESET_PASSWORD_RESPONSE = 16;
  SET_USER_STATUS_REQUEST = 17;
  SET_USER_STATUS_RESPONSE = 18;
  LIST_ONLINE_REQUEST = 19;
  LIST_ONLINE_RESPONSE = 20;
  FORCE_LOGOUT_REQUEST = 21;
  FORCE_LOGOUT_RESPONSE = 22;
  PING_REQUEST = 23;
  PONG_RESPONSE = 24;
  LIST_AUDIT_LOGS_REQUEST = 25;
  LIST_AUDIT_LOGS_RESPONSE = 26;
  STATS_REQUEST = 27;
  STATS_RESPONSE = 28;
  WHOAMI_REQUEST = 29;
  WHOAMI_RESPONSE = 30;
  // 我的登录设备：普通用户查看本人所有会话并自助下线。
  MY_SESSIONS_REQUEST = 31;
  MY_SESSIONS_RESPONSE = 32;
  ERROR_RESPONSE = 100;
}

// 统一错误码：客户端按码做本地化提示，不必匹配服务端英文文案。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  BAD_REQUEST = 1;
  UNAUTHENTICATED = 2;
  PERMISSION_DENIED = 3;
  NOT_FOUND = 4;
  CONFLICT = 5;
  TOO_MANY_ATTEMPTS = 6;
  INTERNAL_ERROR = 7;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message RegisterResponse {
  bool success = 1;
  int64 user_id = 2;
  string message = 3;
  ErrorCode code = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  int64 user_id = 2;
  string role = 3;
  string message = 4;
  ErrorCode code = 5;
  // 登录失败后剩余可重试次数；0 表示已被限流锁定。
  int32 remaining_attempts = 6;
}

message QueryUserRequest {
  string username = 1;
}

message QueryUserResponse {
  bool found = 1;
  int64 user_id = 2;
  string username = 3;
  string role = 4;
  string message = 5;
  string status = 6;
  ErrorCode code = 7;
}

message CheckPermissionRequest {
  string username = 1;
  string required_role = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string message = 2;
  ErrorCode code = 3;
}

message ChangePasswordRequest {
  string username = 1;
  string new_password = 2;
  // 修改自己的密码时必须提供旧密码；管理员重置走 ResetPasswordRequest。
  string old_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
}

message ListUsersRequest {
  // 1 起始的页码；page_size 为 0 时使用服务端默认值。
  int32 page = 1;
  int32 page_size = 2;
  // 按用户名模糊匹配。
  string keyword = 3;
  // active / frozen / 空（不过滤）。
  string status = 4;
  string role = 5;
  // id / username，其他值回退为 id。
  string order_by = 6;
  bool descending = 7;
}

message UserInfo {
  int64 user_id = 1;
  string username = 2;
  string role = 3;
  string status = 4;
}

message ListUsersResponse {
  bool success = 1;
  repeated UserInfo users = 2;
  string message = 3;
  // 符合过滤条件的总记录数，供前端渲染分页器。
  int32 total = 4;
  int32 page = 5;
  int32 page_size = 6;
  ErrorCode code = 7;
}

message ResetPasswordRequest {
  string username = 1;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
  // 服务端生成的一次性初始密码，仅在成功时返回一次。
  string generated_password = 3;
  ErrorCode code = 4;
}

message SetUserStatusRequest {
  string username = 1;
  bool frozen = 2;
}

message SetUserStatusResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
}

message ListOnlineRequest {}

message OnlineSessionInfo {
  string session_id = 1;
  string username = 2;
  string role = 3;
  bool authenticated = 4;
  string peer_address = 5;
  // 最近一次收到该连接数据的时间戳（Unix 秒）。
  int64 last_active_at = 6;
}

message ListOnlineResponse {
  bool success = 1;
  repeated OnlineSessionInfo sessions = 2;
  string message = 3;
  ErrorCode code = 4;
}

message ForceLogoutRequest {
  string session_id = 1;
}

message ForceLogoutResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
}

message PingRequest {
  int64 client_time_ms = 1;
}

message PongResponse {
  int64 client_time_ms = 1;
  int64 server_time_ms = 2;
}

message AuditLogEntry {
  int64 id = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string result = 5;
  string detail = 6;
  string actor_ip = 7;
  int64 created_at = 8;
}

message ListAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string actor = 3;
  string action = 4;
  // Unix 秒，0 表示不限制。
  int64 from_timestamp = 5;
  int64 to_timestamp = 6;
}

message ListAuditLogsResponse {
  bool success = 1;
  repeated AuditLogEntry entries = 2;
  string message = 3;
  int32 total = 4;
  int32 page = 5;
  int32 page_size = 6;
  ErrorCode code = 7;
}

// 服务端运行自观测：管理员可在客户端监控页实时查看。
message StatsRequest {
}

message StatsResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
  // 进程启动到现在的秒数。
  int64 uptime_seconds = 4;
  // 当前存活的 TCP 连接数（主 loop + 全部 sub loop）。
  int32 current_connections = 5;
  // 服务端启动以来累计接受的连接数。
  int64 total_connections = 6;
  // Reactor IO 线程数与业务线程池大小。
  int32 io_threads = 7;
  int32 worker_threads = 8;
  // 存储后端：memory / mysql。
  string storage = 9;
  // 会话注册表中的会话数（含已连接未登录）。
  int32 active_sessions = 10;
}

// 当前会话自观测：普通用户在“我的空间”查看自己的账号与会话信息。
message WhoamiRequest {
}

message WhoamiResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
  int64 user_id = 4;
  string username = 5;
  string role = 6;
  // active / frozen（来自用户仓储的实时状态）。
  string status = 7;
  // 当前连接的来源地址。
  string peer_address = 8;
  // 本次登录时间（Unix 秒）。
  int64 authenticated_at = 9;
  // 最近一次活动时间（Unix 秒）。
  int64 last_active_at = 10;
  int64 server_time_seconds = 11;
}

// 我的登录设备：当前账号在各终端上的会话（只返回本人的会话）。
message MySessionItem {
  string session_id = 1;
  // 来源地址（peer）。
  string peer_address = 2;
  // 该会话的登录时间与最近活动时间（Unix 秒），未登录会话为 0。
  int64 authenticated_at = 3;
  int64 last_active_at = 4;
  // 是否就是发起本次查询的连接。
  bool current = 5;
}

message MySessionsRequest {
}

message MySessionsResponse {
  bool success = 1;
  string message = 2;
  ErrorCode code = 3;
  repeated MySessionItem sessions = 4;
  int32 total = 5;
}

message ErrorResponse {
  string message = 1;
  ErrorCode code = 2;
}
