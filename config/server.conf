# Server
host=0.0.0.0
port=9000
log_file=server.log

# 业务线程池：Protobuf 解析 + 密码哈希 + DB 访问都在这里
worker_threads=4

# sub reactor 数量（one loop per thread）。设为 0 则退化成单 reactor 模式。
io_threads=4

# 连接空闲多久后回收（秒），0 表示关闭该功能
idle_timeout_seconds=300

# 主 loop 检查退出信号的周期（毫秒），越小关闭越快
shutdown_poll_ms=200

# 登录失败限流：窗口内失败 N 次后锁定 M 秒
login_max_failures=5
login_window_seconds=300
login_lock_seconds=300

# 是否允许未登录用户自助注册（1 开 / 0 关，注册出的账号角色固定为 user）
allow_self_register=1

# 审计日志：使用 MySQL 时写 audit_logs 表；否则写这个文件
audit_log_file=data/audit.log

# Use mysql when MySQL client development files are installed.
# Without MySQL support at build time, the server falls back to in-memory storage.
storage=mysql
mysql_host=127.0.0.1
mysql_port=3306
mysql_user=reactor_user
mysql_password=reactor_pass
mysql_database=reactor_user_service
mysql_pool_size=4
